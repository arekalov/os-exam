name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/osexam-release-key.jks

    - name: Build Release APK
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/osexam-release-key.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleWearRelease --stacktrace

    - name: Rename APK
      run: |
        cd app/build/outputs/apk/wear/release/
        if [ -f "app-wear-release.apk" ]; then
          cp app-wear-release.apk osexam.apk
        elif [ -f "app-wear-release-unsigned.apk" ]; then
          cp app-wear-release-unsigned.apk osexam.apk
        else
          echo "APK not found!"
          ls -la
          exit 1
        fi

    - name: Get version name
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/wear/release/osexam.apk
        name: Release ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## OS Exam — Wear OS

          ### Установка
          ```bash
          adb install osexam.apk
          ```
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
