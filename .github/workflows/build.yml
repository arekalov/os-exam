name: Android CI - Build Release APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/osexam-release-key.jks

    - name: Build Release APK
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/osexam-release-key.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleWearRelease --stacktrace

    - name: List APK files
      run: ls -la app/build/outputs/apk/wear/release/

    - name: Rename APK
      run: |
        cd app/build/outputs/apk/wear/release/
        if [ -f "app-wear-release.apk" ]; then
          cp app-wear-release.apk osexam.apk
        elif [ -f "app-wear-release-unsigned.apk" ]; then
          cp app-wear-release-unsigned.apk osexam.apk
        else
          echo "APK not found!"
          ls -la
          exit 1
        fi

    - name: Sanitize branch name
      id: branch
      run: echo "NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: osexam-apk-${{ steps.branch.outputs.NAME }}
        path: app/build/outputs/apk/wear/release/osexam.apk
        retention-days: 30

    - name: Get APK info
      run: |
        echo "APK size: $(du -h app/build/outputs/apk/wear/release/osexam.apk | cut -f1)"
        echo "Branch: ${{ github.ref_name }}"
        echo "Build completed successfully!"
